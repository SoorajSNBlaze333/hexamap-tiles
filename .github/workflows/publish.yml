# Publishes hexamap-tiles to npm. Run it from the Actions tab → "Publish to npm" → Run workflow.
#
# Auth: uses npm trusted publishing (OIDC) when it's set up for this repo on npmjs.com, otherwise
# falls back to an NPM_TOKEN repository secret. See RELEASING.md.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump before publishing (choose none to publish the version already in package.json)"
        type: choice
        options: [none, patch, minor, major]
        default: none
      dry_run:
        description: "Dry run: build and pack, but don't publish or push anything"
        type: boolean
        default: false

permissions:
  contents: write # push the version-bump commit and tag
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck -w hexamap-tiles
          npm test -w hexamap-tiles

      - name: Bump version
        if: inputs.bump != 'none'
        run: npm version ${{ inputs.bump }} -w hexamap-tiles --no-git-tag-version

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/hexamap-tiles/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Make sure this version isn't on npm yet
        run: |
          if npm view "hexamap-tiles@${{ steps.version.outputs.version }}" version 2>/dev/null | grep -q .; then
            echo "::error::hexamap-tiles@${{ steps.version.outputs.version }} is already published. Run again with a version bump."
            exit 1
          fi

      - name: Build
        run: npm run build -w hexamap-tiles

      - name: Use npm token (only if no trusted publisher is set up)
        if: env.NPM_TOKEN != ''
        run: npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"

      - name: Publish
        run: npm publish -w hexamap-tiles --access public --provenance ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit version bump and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="hexamap-tiles@v${{ steps.version.outputs.version }}"
          if [ "${{ inputs.bump }}" != "none" ]; then
            git commit -am "release: $TAG"
          fi
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags
          git push origin "$TAG"

      - name: Summary
        run: |
          echo "### hexamap-tiles v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: nothing was published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published: https://www.npmjs.com/package/hexamap-tiles/v/${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
